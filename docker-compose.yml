version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lighttest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lighttest
      POSTGRES_PASSWORD: lighttest123
      POSTGRES_DB: lighttest
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
